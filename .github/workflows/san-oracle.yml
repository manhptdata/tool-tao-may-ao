name: San Slot Oracle Cloud Singapore

on:
  #schedule:
    # Tự động chạy mỗi 10 phút 24/24
    #- cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  snipe-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPPRESS_LABEL_WARNING: "True"
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
    steps:
      - name: Cai dat OCI CLI
        run: pip install --quiet oci-cli

      - name: Cau hinh xac thuc Oracle Cloud
        run: |
          mkdir -p ~/.oci
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_KEY_CONTENT }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem

          cat << 'EOF' > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ap-singapore-1
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: San may ao ManhPT-server qua Compute API (90s/luot)
        run: |
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > /tmp/oci_ssh.pub
          echo "Bat dau san Compute API tren ${{ secrets.OCI_AD }}..."

          for i in 1 2 3 4 5 6; do
            echo "--- Luot $i luc $(date -u '+%H:%M:%S UTC') ---"
            OUT=$(oci compute instance launch \
              --no-retry \
              --availability-domain "${{ secrets.OCI_AD }}" \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
              --image-id "${{ secrets.OCI_IMAGE_ID }}" \
              --display-name "ManhPT-server" \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 100 \
              --ssh-authorized-keys-file /tmp/oci_ssh.pub 2>&1 || true)

            if echo "$OUT" | grep -q "ocid1.instance."; then
              echo "TAO MAY THANH CONG! VAO ORACLE CLOUD KIEM TRA VA TAT CRON JOB!"
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d text="DA SAN DUOC MAY AO MANHPT-SERVER TREN ORACLE CLOUD! Vao tat cron-job.org ngay." > /dev/null
              break
            elif echo "$OUT" | grep -q "Out of host capacity"; then
              echo "Het slot (Out of host capacity). Cho 90s..."
            else
              echo "Phan hoi khac: $OUT"
            fi

            if [ "$i" -lt 6 ]; then
              sleep 90
            fi
          done
