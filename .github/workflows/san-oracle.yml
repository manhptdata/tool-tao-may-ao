name: San Slot Oracle Cloud Singapore

on:
  #schedule:
    # Tự động chạy mỗi 10 phút 24/24
    #- cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  snipe-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPPRESS_LABEL_WARNING: "True"
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
    steps:
      - name: Cai dat OCI CLI
        run: pip install --quiet oci-cli

      - name: Cau hinh xac thuc Oracle Cloud
        run: |
          mkdir -p ~/.oci
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_KEY_CONTENT }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem

          cat << 'EOF' > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ap-singapore-1
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: San may ao ManhPT-server (2 luot/phien)
        run: |
          STACK_ID=$(oci resource-manager stack list \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --display-name "ManhPT-server" \
            --query "data[0].id" --raw-output)

          if [ -z "$STACK_ID" ] || [ "$STACK_ID" = "null" ]; then
            echo "Loi: Khong tim thay Stack. Kiem tra lai Secrets."
            exit 1
          fi

          echo "Da tim thay Stack thanh cong. Bat dau san..."

          for i in 1 2; do
            echo "--- Luot $i luc $(date -u '+%H:%M:%S UTC') ---"
            JOB_ID=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy AUTO_APPROVED \
              --query "data.id" --raw-output || true)

            if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
              echo "Da tao Job: $JOB_ID"
              sleep 45
              STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output)
              echo "Trang thai Job: $STATUS"

              if [ "$STATUS" = "SUCCEEDED" ]; then
                echo "TAO MAY THANH CONG! HAY VAO ORACLE CLOUD KIEM TRA VA TAT CRON JOB!"
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                  -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                  -d text="DA SAN DUOC MAY AO MANHPT-SERVER TREN ORACLE CLOUD! Vao tat cron-job.org ngay." > /dev/null
                break
              fi
            else
              echo "Khong tao duoc Job trong luot $i."
            fi

            if [ "$i" -lt 2 ]; then
              sleep 180
            fi
          done
